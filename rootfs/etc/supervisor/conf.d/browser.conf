; 所有日志输出到容器 stdout，用 docker logs 查看

[program:tun2socks]
command=/usr/local/bin/svc-tun2socks.sh
priority=10
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvnc]
command=/usr/local/bin/svc-xvnc.sh
user=chrome
environment=HOME="/home/chrome",USER="chrome"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/svc-openbox.sh
user=chrome
environment=HOME="/home/chrome",USER="chrome",DISPLAY=":1"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
; 关掉窗口后会自动重新打开，保证随时“直接可用”
command=/usr/local/bin/svc-chrome.sh
user=chrome
environment=HOME="/home/chrome",USER="chrome",DISPLAY=":1"
priority=40
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=chrome
environment=HOME="/home/chrome",USER="chrome"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
